
# docker compose -f docker-compose-centrovarones/docker-composeBE.yml up -d
# docker compose -f docker-compose-centrovarones/docker-composeBE.yml down

version: '3'

services:
  backend:
    image: centro-varones-backend:latest
    container_name: backend_centro_varones
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    environment:
      - PORT=${PORT:-8081}
      - SERVER_PORT=${PORT:-8081}
      - SPRING_PROFILES_ACTIVE=production
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-1435}
      - DB_NAME=${DB_NAME:-CentroVaronesDB}
      - DB_USERNAME=${DB_USERNAME:-sa}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_ENCRYPT=${DB_ENCRYPT:-false}
      - DB_TRUST_CERTIFICATE=${DB_TRUST_CERTIFICATE:-true}
      - SPRING_JPA_SHOW_SQL=false
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.SQLServerDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_SQL_INIT_MODE=never
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
