
spring:
  application:
    name: centro-varones-backend

  datasource:
    url: "jdbc:sqlserver://localhost:1435;databaseName=CentroVaronesDB;encrypt=true;trustServerCertificate=true"
    username: sa
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

server:
  port: 8081
