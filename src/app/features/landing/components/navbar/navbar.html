
<header class="navbar">
  <div class="contenedor">

    <a routerLink="/" class="logo" (click)="cerrarMenu()">
      <img
        src="/images/insignia-centro-varones.png"
        alt="Insignia del Centro de Varones"
      />

      <div class="nombre-colegio">
        <strong>I.E. N.° 20874</strong>
        <span>Centro de Varones - Cañete</span>
      </div>
    </a>

    <button
      type="button"
      class="menu-toggle"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAbierto"
      aria-label="Abrir menú"
    >
      ☰
    </button>

    <nav class="menu" [class.abierto]="menuAbierto">
      <a href="#inicio" (click)="cerrarMenu()">Inicio</a>
      <a href="#nosotros" (click)="cerrarMenu()">Nosotros</a>
      <a href="#propuesta" (click)="cerrarMenu()">Propuesta educativa</a>
      <a href="#contacto" (click)="cerrarMenu()">Contacto</a>

      <a
        routerLink="/portal"
        class="btn-portal"
        (click)="cerrarMenu()"
      >
        Acceso a portales
      </a>
    </nav>

  </div>
</header>
