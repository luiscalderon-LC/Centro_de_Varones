
<div class="login-page">

  <!-- Encabezado -->
  <header class="login-header">
    <div class="header-container">

      <div class="institution">
        <img
          src="/images/insignia-centro-varones.png"
          alt="Insignia institucional"
          class="institution-logo"
        />

        <div class="institution-info">
          <h2>I.E. N.° 20874</h2>
          <p>Centro de Varones - San Vicente de Cañete</p>
        </div>
      </div>

      <a routerLink="/" class="home-link">Inicio</a>

    </div>
  </header>

  <!-- Contenido principal -->
  <main class="login-main">

    <div class="login-card">

      <div class="login-icon">★</div>

      <h1>Bienvenido</h1>
      <p class="login-subtitle">
        Ingresa para registrar o consultar tus notas
      </p>

      <div class="login-form">

        <label>Tipo de usuario</label>

        <div class="user-selector">
          <a class="active">Docente</a>
          <a routerLink="/login-estudiante">Estudiante</a>
        </div>

        <label for="correo">Correo o código</label>
        <input
          type="text"
          id="correo"
          placeholder="Ingresa tu correo institucional"
        />

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="Ingresa tu contraseña"
        />

        <a href="#" class="forgot-password">
          ¿Olvidaste tu contraseña?
        </a>

        <button type="button" class="login-button">
          Ingresar
        </button>

      </div>

    </div>

  </main>

  <!-- Pie de página -->
  <footer class="login-footer">
    <p>Sistema de Registro y Consulta de Notas</p>
    <small>Proyecto académico · Luis Calderón y Mark Alcalá</small>
  </footer>

  <div class="bottom-line"></div>

</div>
