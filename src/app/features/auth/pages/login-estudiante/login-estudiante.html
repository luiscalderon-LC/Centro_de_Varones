
<div class="login-page">

  <!-- ENCABEZADO -->
  <header class="login-header">
    <div class="header-container">

      <div class="institution">
        <img
          src="/images/insignia-centro-varones.png"
          alt="Insignia del Centro de Varones"
          class="institution-logo"
        />

        <div class="institution-info">
          <h2>I.E. N.° 20874</h2>
          <p>Centro de Varones - San Vicente de Cañete</p>
        </div>
      </div>

      <a routerLink="/" class="btn-volver">
        Volver al inicio
      </a>

    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="login-main">

    <section class="login-card">

      <div class="login-icon">
        <img
          src="/images/insignia-centro-varones.png"
          alt="Insignia institucional"
        />
      </div>

      <h1>Bienvenido</h1>

      <p class="login-subtitle">
        Ingresa para consultar tus calificaciones
      </p>

      <form
        class="login-form"
        (ngSubmit)="ingresar()"
      >

        <label>Tipo de usuario</label>

        <div class="user-selector">
          <a routerLink="/login-docente">
            Docente
          </a>

          <span class="active">
            Estudiante
          </span>
        </div>

        <label for="correo">
          Correo o código
        </label>

        <input
          id="correo"
          name="correo"
          type="text"
          placeholder="Ingresa tu correo o código"
          [(ngModel)]="correo"
          autocomplete="username"
          required
        />

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          name="password"
          type="password"
          placeholder="Ingresa tu contraseña"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        />

        <a
          href="#"
          class="forgot-password"
          (click)="$event.preventDefault()"
        >
          ¿Olvidaste tu contraseña?
        </a>

        <button
          type="submit"
          class="login-button"
        >
          Ingresar
        </button>

      </form>

    </section>

  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="login-footer">
    <p>Sistema de Registro y Consulta de Notas</p>
    <small>
      Proyecto académico · Luis Calderón y Mark Alcalá
    </small>
  </footer>

  <div class="bottom-line"></div>

</div>
