
<div class="login-page">

  <!-- Encabezado institucional -->
  <header class="login-header">
    <div class="header-container">

      <div class="institution">
        <img
          src="/images/insignia-centro-varones.png"
          alt="Insignia del Centro de Varones"
          class="institution-logo"
        />

        <div class="institution-info">
          <h2>I.E. N.° 20874</h2>
          <p>Centro de Varones - San Vicente de Cañete</p>
        </div>
      </div>

      <a routerLink="/login-estudiante" class="btn-estudiante">
      Ingresar como alumno
      </a>

    </div>
  </header>

  <!-- Formulario de estudiante -->
  <main class="login-main">

    <div class="login-card">

      <div class="login-icon">★</div>

      <h1>Bienvenido</h1>

      <p class="login-subtitle">
        Ingresa para registrar o consultar tus notas
      </p>

      <form class="login-form" (ngSubmit)="ingresar()">

        <label>Tipo de usuario</label>

        <div class="user-selector">
          <a routerLink="/login-docente">Docente</a>
          <a class="active">Estudiante</a>
        </div>

        <label for="correo">Correo o código</label>
        <input
          id="correo"
          name="correo"
          type="text"
          placeholder="Ingresa tu correo institucional"
          [(ngModel)]="correo"
          required
        />

        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Ingresa tu contraseña"
          [(ngModel)]="password"
          required
        />

        <a href="#" class="forgot-password"
           (click)="$event.preventDefault()">
          ¿Olvidaste tu contraseña?
        </a>

        <button type="submit" class="login-button">
          Ingresar
        </button>

      </form>

    </div>

  </main>

  <!-- Pie de página -->
  <footer class="login-footer">
    <p>Sistema de Registro y Consulta de Notas</p>
    <small>Proyecto académico · Luis Calderón y Mark Alcalá</small>
  </footer>

  <div class="bottom-line"></div>

</div>
