# 1. Levantar SQL Server:
# docker compose --env-file .env -p centro-varones -f docker-compose\docker.composeBD.yml up -d
#
# 2. Conectarse a CentroVaronesDB (solicita la contraseña de DB_PASSWORD):
# docker exec -it proyecto-CV-sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -d CentroVaronesDB
#
# 3. Construir y levantar el backend:
# docker compose --env-file .env -p centro-varones -f docker-compose\docker.composeBE.yml build
# docker compose --env-file .env -p centro-varones -f docker-compose\docker.composeBE.yml up -d
services:
  sqlserver:
    image: markalcala/centro-varones-sqlserver:2025
    container_name: proyecto-CV-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD en .env}"
    ports:
      - "${DB_PORT:-1433}:1433"
    restart: unless-stopped
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  mssql-data: